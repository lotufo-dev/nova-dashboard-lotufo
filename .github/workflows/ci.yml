# CI minimo (fase 3,5): a suite do backend, tipos + lint + testes do frontend e o
# build. Roda em push, pull request e na fila de merge (merge_group); nada e' publicado
# daqui -- a producao sobe a mao pelo runbook, no <servidor>.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Fila de merge: o GitHub junta a PR com a master atual e roda a CI nessa mistura antes de
  # mergear. Os jobs exigidos pelo ruleset (backend, frontend, vazamento) precisam rodar aqui
  # tambem, senao a fila espera para sempre.
  merge_group:

# Push novo numa PR cancela a execucao anterior dela, que ja' perdeu o sentido (issue #89:
# 3 pushes em 6 minutos rodaram os 3 inteiros). Em master o grupo e' o proprio commit, entao
# nada e' cancelado nem fica em fila: cada merge precisa da propria execucao verde (a skill
# deploy confere o commit), e um grupo so' por branch cancelaria ate' a execucao que espera.
# Na fila de merge cada grupo tem commit proprio, entao tambem cai no grupo pelo sha.
# Backend em dois jobs (issue #367): `backend` roda o grosso da suite no Ubuntu com pytest-xdist
# (-n 4, `-m "not windows"`), porque o disco do runner Windows levava 11 a 14 min; `backend-windows`
# roda `-m "windows or pdf"`: backup e ACL (tests/test_backup.py) e os modulos que geram PDF com a
# Arial da producao (carta, FRC, protocolo, pdfs), que no Ubuntu so' passam pelo ramo Helvetica.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Dado real no repositorio publico (issue #106): CNPJ/CPF validos, e-mail de dominio real, chave de NFS-e/NF-e e o
  # nome da maquina (scripts/vazamento.py) e segredo tecnico (gitleaks). O log e' publico: o script so' mostra
  # o dado mascarado. A lista de nomes de pessoas e' local do Leo, entao aqui essa parte e' pulada. O nome da
  # maquina vem do secret DASH_SERVIDOR (sem ele, ex. PR de fork, a checagem e' pulada com aviso). Na PR, o
  # script tambem varre cada commit da PR (dado que entra e sai continua no historico), e um passo proprio falha
  # se ela altera o script, a lista de excecoes ou os hooks: essas mudancas exigem merge do Leo.
  vazamento:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Varredura de dado real
        if: ${{ !cancelled() }}
        env:
          DASH_SERVIDOR: ${{ secrets.DASH_SERVIDOR }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/vazamento.py --base "origin/$BASE_REF"
          else
            python scripts/vazamento.py
          fi
      # gitleaks pela linha de comando (MIT, sem chave): o gitleaks-action exige licenca paga em repositorio de
      # organizacao, e o repositorio mora na organizacao lotufo-dev desde 15/10/2026 (fila de merge). Versao e
      # sha256 fixados. Varre so' os commits novos: os da PR (--first-parent: sem os da master que entram por merge
      # na branch), os do push e os das PRs do grupo da fila (o commit de merge em si fica de fora, --no-merges).
      # --redact: o log e' publico.
      - name: Segredo tecnico (gitleaks)
        if: ${{ !cancelled() }}
        env:
          EVENTO: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_ANTES: ${{ github.event.before }}
          FILA_BASE: ${{ github.event.merge_group.base_sha }}
          FILA_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          versao=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${versao}/gitleaks_${versao}_linux_x64.tar.gz"
          echo "${sha}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          case "$EVENTO" in
            pull_request) faixa="--no-merges --first-parent ${PR_BASE}..${PR_HEAD}" ;;
            merge_group)  faixa="--no-merges ${FILA_BASE}..${FILA_HEAD}" ;;
            *)
              if [ -n "$PUSH_ANTES" ] && ! echo "$PUSH_ANTES" | grep -q '^0*$'; then
                faixa="--no-merges ${PUSH_ANTES}..${GITHUB_SHA}"
              else
                faixa="-1 ${GITHUB_SHA}"
              fi ;;
          esac
          /tmp/gitleaks git --redact --verbose --exit-code 1 --log-opts="$faixa" .
      # A CI roda o script da propria PR; por isso quem decide se o script, a lista de excecoes ou os hooks
      # mudaram e' este passo (o ci.yml e' protegido por `.github/`), nao o script. Arquivo novo nao conta.
      # Fica por ultimo e os passos acima usam `!cancelled()`: um passo vermelho nao pode esconder a varredura
      # nem o gitleaks justamente nas PRs que mexem no script ou nos hooks.
      - name: Script, lista de excecoes e hooks so mudam com merge do Leo
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mudou=$(git diff --name-only --no-renames --diff-filter=MDT "origin/$BASE_REF...HEAD" -- scripts/vazamento.py scripts/vazamento-excecoes.txt .githooks)
          if [ -n "$mudou" ]; then
            echo "::error::Esta PR altera arquivos que decidem o que a varredura de dado real deixa passar. Isso exige merge do Leo."
            echo "$mudou"
            exit 1
          fi

  # Nome mantido: e' check obrigatorio do ruleset `master protegida`.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
        working-directory: backend
      - run: python -m pytest -q -n 4 -m "not windows"
        working-directory: backend

  # Marcador `windows` (caminho e ferramenta do Windows) e `pdf` (ramo Arial da carta/FRC).
  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
        working-directory: backend
      - run: python -m pytest -q -m "windows or pdf"
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -b
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npx vite build
        working-directory: frontend
