<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obras · Lista</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="proto-obras.css">
<style>
  .avisos-area .tabela--grade col.c-quando { width: 150px; }
  .avisos-area .tabela--grade col.c-valor-aviso { width: 150px; }
  .avisos-area .tabela--grade col.c-onde { width: 260px; }
  .avisos-area .cartao + .cartao, .avisos-area .grupos > * + * { margin-top: 16px; }
  .avisos-area__corpo { display: grid; gap: 16px; }
  .avisos-area .grupos > .cartao { box-shadow: none; }
  .aviso__fato .forte { margin-right: 2px; }
  .tabela.obras-lista td .campo__nota { white-space: nowrap; }
</style>
</head>
<body data-secao="obras" data-titulo="Obras">
<main id="conteudo">
  <header class="topbar topbar--detalhe">
    <div class="topbar__trilha">
      <nav class="migalhas" aria-label="Caminho"><ol><li><a href="obras.html">Obras</a></li><li aria-current="page"><span id="migalha"></span></li></ol></nav>
    </div>
    <div class="topbar__linha topbar__linha--quebra">
      <h1 class="topbar__titulo topbar__titulo--grande" id="titulo"></h1>
      <span class="topbar__meta" id="meta"></span>
    </div>
  </header>

  <div class="pagina">
    <!-- filtros numa linha, discretos -->
    <section class="filtros" aria-label="Filtros das obras">
      <div class="campo">
        <label class="sr-only" for="busca">Buscar obra</label>
        <input id="busca" type="search" placeholder="Buscar obra, contrato ou empresa…" autocomplete="off" spellcheck="false">
      </div>
      <p class="filtros-avisos__linha" id="termina">
        <span class="campo__rotulo">Terminam</span>
        <a href="#" data-termina="90">em 90 dias</a>
        <a href="#" data-termina="180">em 6 meses</a>
        <a href="#" data-termina="">em qualquer data</a>
      </p>
      <label class="marcar"><input type="checkbox" id="encerradas"> Mostrar as encerradas</label>
      <div class="filtros__fim">
        <p class="filtros-avisos__linha" id="ver">
          <span class="campo__rotulo">Ver</span>
          <a href="#" data-ver="cartoes">cartões</a>
          <a href="#" data-ver="tabela">tabela</a>
        </p>
        <button type="button" class="btn btn--avisos" id="abrir-avisos" aria-expanded="false" aria-controls="avisos-area"></button>
      </div>
    </section>

    <!-- Avisos: moram dentro de Obras; abrem aqui, na própria página -->
    <section class="cartao avisos-area" id="avisos-area" aria-labelledby="titulo-avisos" hidden>
      <div class="cartao__cabeca">
        <h2 class="cartao__titulo" id="titulo-avisos">Avisos</h2>
        <span class="cartao__dica num" id="avisos-conta"></span>
        <div class="cartao__acoes"><button type="button" class="btn btn--pequeno" id="fechar-avisos">Fechar os avisos</button></div>
      </div>
      <div class="cartao__corpo avisos-area__corpo">
        <div class="filtros-avisos__linhas">
          <p class="filtros-avisos__linha" id="av-agrupar">
            <span class="campo__rotulo">Agrupar</span>
            <a href="#" data-agrupar="tipo">por tipo</a>
            <a href="#" data-agrupar="obra">por obra</a>
          </p>
          <p class="filtros-avisos__linha" id="av-tipo"></p>
          <div class="form-inline">
            <div class="campo">
              <label class="campo__rotulo" for="av-nivel">Nível</label>
              <select id="av-nivel"><option value="">Todos</option><option value="critico">Crítico</option><option value="acao">Ação</option><option value="atencao">Atenção</option></select>
            </div>
            <div class="campo">
              <label class="campo__rotulo" for="av-obra">Obra</label>
              <select id="av-obra"></select>
            </div>
          </div>
          <p class="filtros-avisos__linha" id="av-so-obra" hidden></p>
        </div>
        <div class="grupos" id="av-grupos"></div>
      </div>
    </section>

    <p class="contagem" id="contagem" role="status"></p>
    <div id="obras"></div>
  </div>
</main>
<script src="shell.js"></script>
<script src="proto-obras-dados.js"></script>
<script>
(function () {
  const { OBRAS, STATUS, NIVEL, FAMILIAS, contratante, numeros, avisos: todosAvisos } = DADOS;
  const { brl, fmtData, diasAte, quandoVence, diasTxt } = FMT;
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ICONE_CAL = '<svg class="icone icone--p" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
  const ICONE_ALERTA = '<svg class="icone icone--p" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>';

  /* ----------------------------------------------------------- estado na URL */
  const url = new URLSearchParams(location.search);
  const c = contratante(url.get("c") || "");
  const est = {
    q: url.get("q") || "", termina: url.get("termina") || "", encerradas: url.get("encerradas") === "1",
    ver: url.get("ver") === "tabela" ? "tabela" : "cartoes",
    avisos: url.get("avisos") === "1", agrupar: url.get("agrupar") === "obra" ? "obra" : "tipo",
    familia: url.get("familia") || "", nivel: url.get("nivel") || "", obra: url.get("obra") || "",
  };
  function gravar() {
    const p = new URLSearchParams();
    if (c) p.set("c", c.id);
    for (const [k, v] of Object.entries(est)) {
      if (v === true) p.set(k, "1");
      else if (v && !(k === "ver" && v === "cartoes") && !(k === "agrupar" && v === "tipo")) p.set(k, v);
    }
    history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : ""));
  }

  const doContratante = OBRAS.filter(o => !c || o.c === c.id);
  const nomeLista = c ? c.nome : "Todas as obras";
  $("migalha").textContent = nomeLista; $("titulo").textContent = nomeLista;
  document.title = "Obras · " + nomeLista;

  /* ----------------------------------------------------------- avisos do recorte */
  const avisosDoRecorte = todosAvisos().filter(a => a.obra ? doContratante.some(o => o.id === a.obra) : !c);
  const avisosDaObra = id => avisosDoRecorte.filter(a => a.obra === id);
  const nomeObra = id => OBRAS.find(o => o.id === id)?.nome ?? id;

  /* ----------------------------------------------------------- o prazo da obra (fim da execucao, como a lista de hoje) */
  function fimHtml(fim, dias, nivel, opcoes = {}) {
    if (opcoes.paralisada) return fmtData(fim) + '<div class="campo__nota texto--atencao"><span class="prazo__ponto" aria-hidden="true"></span>Paralisada desde ' + fmtData(opcoes.paralisada) + "</div>";
    const cls = nivel ? " texto--" + nivel : "";
    const marca = nivel === "critico" ? ICONE_ALERTA : nivel ? '<span class="prazo__ponto" aria-hidden="true"></span>' : "";
    return fmtData(fim) + (opcoes.aberta ? '<div class="campo__nota prazo--data' + cls + '">' + marca + quandoVence(dias) + "</div>" : "")
      + (opcoes.automatica ? '<div class="campo__nota">o órgão prorroga junto</div>' : "");
  }
  const nivelDoPrazo = d => d < 0 ? "critico" : d <= 30 ? "acao" : d <= 90 ? "atencao" : null;

  /* ----------------------------------------------------------- lista de obras */
  function filtradas() {
    const q = est.q.trim().toLowerCase();
    return doContratante.filter(o => {
      if (!est.encerradas && o.status === "encerrado") return false;
      if (est.termina) {
        if (o.paralisadaDesde || o.status === "encerrado") return false;   // obra paralisada nao conta o vencimento da execucao
        const d = diasAte(o.execFim);
        if (d > Number(est.termina)) return false;
      }
      if (q && ![o.nome, o.instrumento, o.empresa, contratante(o.c).nome].some(t => t.toLowerCase().includes(q))) return false;
      return true;
    }).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  }

  function cartao(o) {
    const n = numeros(o), av = avisosDaObra(o.id), s = STATUS[o.status];
    const selo = o.status !== "ativo" ? '<span class="selo ' + s.classe + '"><span class="selo__ponto" aria-hidden="true"></span>' + s.rotulo + "</span>" : "";
    const aviso = av.length
      ? '<p class="obra-cartao__linha texto--' + av[0].nivel + '"><span class="ponto ponto--' + av[0].nivel + '" aria-hidden="true"></span><span>'
        + esc(av[0].curto) + (av.length > 1 ? ' <span class="obra-cartao__mais">· mais ' + (av.length - 1) + "</span>" : "") + "</span></p>"
      : "";
    const fim = o.paralisadaDesde ? "termina em " + fmtData(o.execFim) + ", com o prazo parado"
      : o.status === "encerrado" ? "terminou em " + fmtData(o.execFim) : "termina em " + fmtData(o.execFim);
    return '<li><a class="cartao obra-cartao" href="pagina-da-obra.html?o=' + o.id + '">'
      + '<div class="obra-cartao__cabeca"><h2 class="obra-cartao__nome">' + esc(o.nome) + "</h2>" + selo + "</div>"
      + '<span class="obra-cartao__orgao">' + esc(contratante(o.c).nome) + "</span>"
      + '<div class="obra-cartao__pct"><strong>' + n.pct + "%</strong><span>executado</span></div>"
      + aviso
      + '<p class="obra-cartao__linha obra-cartao__linha--fim">' + ICONE_CAL + "<span>" + fim + "</span></p>"
      + "</a></li>";
  }

  function tabela(lista) {
    const linhas = lista.map((o, i) => {
      const n = numeros(o), av = avisosDaObra(o.id), s = STATUS[o.status], aberta = o.status === "ativo";
      const dExec = diasAte(o.execFim), dVig = diasAte(o.vigFim);
      const criticos = av.filter(a => a.nivel === "critico").length;
      const avHtml = !av.length ? "—" : '<a href="#" data-avisos-obra="' + o.id + '">'
        + (criticos ? '<span class="selo selo--acao"><span class="selo__ponto" aria-hidden="true"></span>' + criticos + (criticos === 1 ? " crítico" : " críticos") + "</span>" : av.length) + "</a>"
        + (criticos && av.length > criticos ? '<div class="campo__nota sem-quebra">de ' + av.length + " avisos</div>" : "");
      const pedido = o.pedido ? '<a href="pagina-da-obra.html?o=' + o.id + '&aba=prazos"><span class="sem-quebra">' + o.pedido.oficio + "</span>, há " + diasTxt(o.pedido.ha) + "</a>" : "—";
      return '<tr class="linha' + (i % 2 ? " par" : "") + '">'
        + '<td><a class="nome-link" href="pagina-da-obra.html?o=' + o.id + '">' + esc(o.nome) + '</a><div class="campo__nota num">' + o.instrumento + "</div></td>"
        + "<td>" + esc(contratante(o.c).nome) + "</td><td>" + esc(o.empresa) + "</td>"
        + '<td><span class="selo ' + s.classe + '"><span class="selo__ponto" aria-hidden="true"></span>' + s.rotulo + "</span></td>"
        + '<td class="col-num dinheiro num">' + brl(o.vig) + "</td>"
        + '<td class="col-num num">' + n.pct + "%</td>"
        + '<td class="num">' + fimHtml(o.execFim, dExec, aberta ? nivelDoPrazo(dExec) : null, { aberta, paralisada: o.paralisadaDesde }) + "</td>"
        + '<td class="num">' + fimHtml(o.vigFim, dVig, aberta && !o.vigAutomatica ? nivelDoPrazo(dVig) : null, { aberta: aberta && !o.vigAutomatica, automatica: o.vigAutomatica }) + "</td>"
        + '<td class="pedido">' + pedido + "</td>"
        + '<td class="col-num num">' + avHtml + "</td></tr>";
    }).join("");
    return '<section class="cartao"><div class="tabela-wrap tabela-wrap--alta"><table class="tabela obras-lista"><caption class="sr-only">Obras</caption><thead><tr>'
      + '<th scope="col">Obra</th><th scope="col">Órgão</th><th scope="col">Empresa</th><th scope="col">Status</th>'
      + '<th scope="col" class="col-num">Valor vigente</th><th scope="col" class="col-num">Executado</th><th scope="col" class="col-data">Fim da execução</th>'
      + '<th scope="col" class="col-data">Fim da vigência</th><th scope="col">Pedido de prorrogação</th><th scope="col" class="col-num">Avisos</th>'
      + "</tr></thead><tbody>" + linhas + "</tbody></table></div></section>";
  }

  function desenharObras() {
    const lista = filtradas();
    const total = doContratante.filter(o => est.encerradas || o.status !== "encerrado").length;
    const recorte = [est.termina === "90" && "terminam em 90 dias", est.termina === "180" && "terminam em 6 meses",
      est.q && "busca “" + est.q + "”"].filter(Boolean);
    const temFiltro = recorte.length > 0;
    $("contagem").innerHTML = (temFiltro ? "<strong>" + lista.length + "</strong> de " + total : "<strong>" + lista.length + "</strong>")
      + (lista.length === 1 && !temFiltro ? " obra" : " obras") + (est.encerradas ? ", com as encerradas" : "")
      + (recorte.length ? " · " + esc(recorte.join(" · ")) + ' · <a href="#" id="limpar">Limpar os filtros</a>' : "");
    let html;
    if (!lista.length) {
      html = '<section class="cartao"><div class="vazio vazio--curto vazio-cartao"><p class="vazio__titulo">' + (temFiltro ? "Nenhuma obra com esses filtros." : "Nenhuma obra sem as encerradas.") + "</p>"
        + (temFiltro ? '<p><a href="#" id="limpar2">Limpar os filtros</a></p>' : '<p><a href="#" id="mostrar-enc">Mostrar as encerradas</a></p>') + "</div></section>";
    } else html = est.ver === "tabela" ? tabela(lista) : '<ul class="obra-cartoes" aria-label="Obras">' + lista.map(cartao).join("") + "</ul>";
    $("obras").innerHTML = html;
    for (const id of ["limpar", "limpar2"]) $(id)?.addEventListener("click", e => { e.preventDefault(); est.q = ""; est.termina = ""; $("busca").value = ""; tudo(); });
    $("mostrar-enc")?.addEventListener("click", e => { e.preventDefault(); est.encerradas = true; $("encerradas").checked = true; tudo(); });
    document.querySelectorAll("[data-avisos-obra]").forEach(a => a.addEventListener("click", e => {
      e.preventDefault(); est.avisos = true; est.obra = a.dataset.avisosObra; tudo(); $("avisos-area").scrollIntoView({ behavior: "smooth", block: "start" });
    }));
    // nao ha' rolagem horizontal da pagina: a tabela larga rola dentro do proprio cartao
  }

  /* ----------------------------------------------------------- avisos (a tela de Avisos de hoje, dentro de Obras) */
  const contagemNiveis = itens => {
    const n = k => itens.filter(a => a.nivel === k).length;
    return [[n("critico"), n("critico") === 1 ? "crítico" : "críticos"], [n("acao"), "de ação"], [n("atencao"), "de atenção"]]
      .filter(([q]) => q).map(([q, r]) => q + " " + r).join(", ");
  };
  const selo = a => { const n = NIVEL[a.nivel]; return '<span class="selo ' + n.classe + (n.forte ? " selo--forte" : "") + '"><span class="selo__ponto" aria-hidden="true"></span>' + n.rotulo + "</span>"; };
  const cabecaAvisos = comValor => '<colgroup><col class="c-nivel"><col><col class="c-quando">' + (comValor ? '<col class="c-valor-aviso">' : "") + '<col class="c-onde"></colgroup>'
    + '<thead><tr><th scope="col">Nível</th><th scope="col">Aviso</th><th scope="col">Quando</th>' + (comValor ? '<th scope="col" class="col-num">Valor</th>' : "") + '<th scope="col">Onde se resolve</th></tr></thead>';
  function linhaAviso(a, omitirObra, comValor) {
    const quem = a.obra ? nomeObra(a.obra) : a.entidade;
    const fato = (!omitirObra && quem ? '<span class="forte">' + esc(quem) + "</span>: " : "") + esc(a.texto);
    const onde = a.onde + (!omitirObra && a.obra && !a.onde.includes("·") ? " · " + nomeObra(a.obra) : "");
    return "<tr><td>" + selo(a) + '</td><td class="aviso__fato">' + fato + '</td><td class="num">' + a.quando + "</td>"
      + (comValor ? '<td class="col-num dinheiro num">' + (a.valor ? brl(a.valor) : "") + "</td>" : "")
      + '<td><a href="' + a.href + '">' + esc(onde) + "</a></td></tr>";
  }
  const tabelaAvisos = (itens, omitirObra, comValor) => '<div class="tabela-wrap"><table class="tabela tabela--grade">' + cabecaAvisos(comValor) + "<tbody>"
    + itens.map(a => linhaAviso(a, omitirObra, comValor)).join("") + "</tbody></table></div>";

  function desenharAvisos() {
    const aberto = est.avisos;
    $("avisos-area").hidden = !aberto;
    $("abrir-avisos").setAttribute("aria-expanded", String(aberto));
    $("abrir-avisos").textContent = (aberto ? "Esconder os avisos" : "Avisos") + " (" + avisosDoRecorte.length + ")";
    if (!aberto) return;
    const base = avisosDoRecorte;
    const filtra = (f = {}) => base.filter(a => (!(f.familia ?? est.familia) || a.familia === (f.familia ?? est.familia))
      && (!est.nivel || a.nivel === est.nivel) && (!est.obra || a.obra === est.obra));
    const itens = filtra();
    const temFiltro = !!(est.familia || est.nivel || est.obra);
    $("titulo-avisos").textContent = "Avisos · " + nomeLista;
    $("avisos-conta").textContent = (temFiltro ? itens.length + " de " : "") + base.length + (base.length === 1 ? " aviso" : " avisos")
      + (base.length ? " · " + contagemNiveis(base) : "");
    document.querySelectorAll("#av-agrupar a").forEach(a => a.setAttribute("aria-current", String(a.dataset.agrupar === est.agrupar)));
    $("av-tipo").innerHTML = '<span class="campo__rotulo">Tipo</span><a href="#" data-familia=""' + (est.familia ? "" : ' aria-current="true"') + ">Todas</a>"
      + FAMILIAS.map(([id, rot]) => { const n = filtra({ familia: id }).length; if (!n && est.familia !== id) return "";
        return '<a href="#" data-familia="' + id + '"' + (est.familia === id ? ' aria-current="true"' : "") + ">" + rot + ' <span class="num">' + n + "</span></a>"; }).join("");
    $("av-nivel").value = est.nivel;
    const obrasComAviso = [...new Set(base.filter(a => a.obra).map(a => a.obra))].sort((x, y) => nomeObra(x).localeCompare(nomeObra(y), "pt-BR"));
    const obraSemAviso = est.obra && !obrasComAviso.includes(est.obra);
    $("av-obra").innerHTML = '<option value="">Todas</option>' + (obraSemAviso ? '<option value="' + est.obra + '">' + esc(nomeObra(est.obra)) + "</option>" : "")
      + obrasComAviso.map(id => '<option value="' + id + '">' + esc(nomeObra(id)) + "</option>").join("");
    $("av-obra").value = est.obra;
    const so = $("av-so-obra");
    so.hidden = !est.obra;
    if (est.obra) so.innerHTML = (obraSemAviso ? "<span>Filtro de uma obra que não tem avisos: <a href=\"pagina-da-obra.html?o=" + est.obra + "\">abrir a obra</a></span>"
      : '<span>Só os avisos de <a href="pagina-da-obra.html?o=' + est.obra + '">' + esc(nomeObra(est.obra)) + "</a></span>") + ' · <a href="#" id="av-todas-obras">ver de todas as obras</a>';

    const comValor = itens.some(a => a.valor);
    let html = "";
    if (!itens.length) {
      html = '<div class="vazio vazio--curto"><p class="vazio__titulo">' + (temFiltro ? "Nenhum aviso com esses filtros." : "Nenhum aviso. Tudo em dia.") + "</p>"
        + (temFiltro ? '<p><a href="#" id="av-limpar">Limpar os filtros</a></p>' : "") + "</div>";
    } else if (est.agrupar === "obra") {
      // uma tabela so', um bloco por obra (ou empresa), aberto pela linha de grupo
      const grupos = new Map();
      for (const a of itens) { const k = a.obra || "emp-" + a.entidade; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(a); }
      html = '<section class="cartao"><div class="tabela-wrap"><table class="tabela tabela--grade">' + cabecaAvisos(comValor)
        + [...grupos].map(([k, g]) => {
          const titulo = g[0].obra ? '<a href="pagina-da-obra.html?o=' + g[0].obra + '">' + esc(nomeObra(g[0].obra)) + "</a>" : '<a href="documentos.html">Documentos · ' + esc(g[0].entidade) + "</a>";
          return '<tbody><tr class="grupo"><th scope="rowgroup" colspan="' + (comValor ? 5 : 4) + '">' + titulo + '<span class="grupo__conta num">' + contagemNiveis(g) + "</span></th></tr>"
            + g.map(a => linhaAviso(a, true, comValor)).join("").replace(/^<tbody>|<\/tbody>$/g, "") + "</tbody>";
        }).join("") + "</table></div></section>";
    } else {
      // por tipo: Atencao recolhida (com o mais urgente no resumo), menos quando ha' filtro
      html = FAMILIAS.map(([id, rot]) => {
        const g = itens.filter(a => a.familia === id); if (!g.length) return "";
        const graves = temFiltro ? g : g.filter(a => a.nivel !== "atencao"), atencao = temFiltro ? [] : g.filter(a => a.nivel === "atencao");
        return '<section class="cartao"><div class="cartao__cabeca"><h3 class="cartao__titulo">' + rot + '</h3><span class="cartao__dica num">' + contagemNiveis(g) + "</span></div>"
          + (graves.length ? tabelaAvisos(graves, false, comValor) : "")
          + (atencao.length ? '<details class="detalhes detalhes--tabela cartao__corpo"><summary>Atenção (' + atencao.length + ')<span class="detalhes__resto"> · o mais urgente: '
            + selo(atencao[0]) + " " + (atencao[0].obra ? '<span class="forte">' + esc(nomeObra(atencao[0].obra)) + "</span>: " : "") + esc(atencao[0].texto) + "</span></summary>"
            + tabelaAvisos(atencao, false, comValor) + "</details>" : "")
          + "</section>";
      }).join("");
    }
    $("av-grupos").innerHTML = html;
    $("av-limpar")?.addEventListener("click", e => { e.preventDefault(); est.familia = est.nivel = est.obra = ""; tudo(); });
    $("av-todas-obras")?.addEventListener("click", e => { e.preventDefault(); est.obra = ""; tudo(); });
    document.querySelectorAll("#av-tipo a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); est.familia = a.dataset.familia; tudo(); }));
  }

  /* ----------------------------------------------------------- cabecalho e controles */
  function desenharCabeca() {
    const ativas = doContratante.filter(o => o.status !== "encerrado");
    const vig = ativas.reduce((a, o) => a + o.vig, 0), med = ativas.reduce((a, o) => a + numeros(o).medido, 0);
    $("meta").innerHTML = ativas.length + (ativas.length === 1 ? " obra" : " obras") + " · " + Math.round(med / vig * 100) + '% executado · saldo a executar <span class="mono">' + brl(vig - med) + "</span>";
    document.querySelectorAll("#termina a").forEach(a => a.setAttribute("aria-current", String(a.dataset.termina === est.termina)));
    document.querySelectorAll("#ver a").forEach(a => a.setAttribute("aria-current", String(a.dataset.ver === est.ver)));
  }
  function tudo() { gravar(); desenharCabeca(); desenharAvisos(); desenharObras(); }

  $("busca").value = est.q;
  $("encerradas").checked = est.encerradas;
  let espera;
  $("busca").addEventListener("input", e => { clearTimeout(espera); espera = setTimeout(() => { est.q = e.target.value; tudo(); }, 200); });
  $("encerradas").addEventListener("change", e => { est.encerradas = e.target.checked; tudo(); });
  document.querySelectorAll("#termina a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); est.termina = a.dataset.termina; tudo(); }));
  document.querySelectorAll("#ver a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); est.ver = a.dataset.ver; tudo(); }));
  document.querySelectorAll("#av-agrupar a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); est.agrupar = a.dataset.agrupar; tudo(); }));
  $("abrir-avisos").addEventListener("click", () => { est.avisos = !est.avisos; tudo(); });
  $("fechar-avisos").addEventListener("click", () => { est.avisos = false; tudo(); $("abrir-avisos").focus(); });
  $("av-nivel").addEventListener("change", e => { est.nivel = e.target.value; tudo(); });
  $("av-obra").addEventListener("change", e => { est.obra = e.target.value; tudo(); });
  tudo();
  if (est.avisos && url.get("obra")) $("avisos-area").scrollIntoView({ block: "start" });
})();
</script>
</body></html>
