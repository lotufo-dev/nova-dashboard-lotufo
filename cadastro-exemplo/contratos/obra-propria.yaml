# Cronograma físico-financeiro, uma versão por documento (issue #256). `data` é a do documento: a versão vale a
# partir do mês dela, e os meses anteriores ficam com o previsto da versão de antes. origem: contratual, aditivo,
# carta ou smo. Versão aplicada não muda: correção é versão nova, com outra chave.
# Versão já gravada sem linha no cadastro (a carga de 04/09/2026, uma publicada na tela) sai da conta com
# `cronograma_superadas: [<número da versão>]` (issue #395): continua no histórico, marcada como superada; tirar o
# número da lista não a faz voltar.
cronograma:
- chave: contratual
  origem: contratual
  data: '2025-03-10'
  itens:
  - {competencia: 2025-03, valor: '500.000,00'}
  - {competencia: 2025-06, valor: '1.500.000,00'}
  - {competencia: 2025-09, valor: '2.000.000,00'}
  - {competencia: 2025-12, valor: '2.000.000,00'}
  - {competencia: 2026-03, valor: '2.000.000,00'}
  - {competencia: 2026-06, valor: '2.000.000,00'}
- chave: ta-01
  origem: aditivo
  data: '2026-02-02'
  instrumento: ta-01
  itens:
  - {competencia: 2026-03, valor: '1.500.000,00'}
  - {competencia: 2026-06, valor: '2.000.000,00'}
  - {competencia: 2026-09, valor: '1.500.000,00'}
