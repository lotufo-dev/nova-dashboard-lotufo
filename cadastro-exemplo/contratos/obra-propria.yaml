# Opcional (issue #462): substitui, só neste contrato, as peças que o órgão marca `no_oficio`; [] desliga todas.
# pecas_no_oficio: [cronograma]
instrumentos:
- chave: ta-01
  tipo: aditivo_valor
  data: '2026-02-02'
  numero: 001/2025/01/01
  objeto: 1º Termo Aditivo de valor (acréscimo de R$ 1.000.000,00)
  delta_valor: 1.000.000,00
