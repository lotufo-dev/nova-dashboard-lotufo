- chave: ap-01
  tipo: apostilamento_prazo
  data: '2026-06-01'
  numero: 001/2025/02/01
  objeto: 1º Termo de Apostilamento de prazo (mais 60 dias)
  nova_execucao_fim: '2026-09-30'
  nova_vigencia_fim: '2026-12-28'
  # --- Apostilamento de reajuste, estilo SINFRA: `periodo` + lista explícita de `competencias` (valor em reais e
  # nº da medição do órgão). `ciclo` é o ano; sem ele vale o ano da `eficacia` ou da data do termo.
- chave: ap-reaj-01
  tipo: apostilamento_reajuste
  data: '2026-03-16'
  numero: 001/2025/03/01
  objeto: 1º Termo de Apostilamento de reajuste (data-base 06/2024)
  data_base: 2024-06
  ciclo: 2025
  eficacia: '2026-03-16'
  periodo: {de: 2025-06, ate: 2025-08}
  competencias:
  - {competencia: 2025-06, valor: '20.000,00', medicao: 3}
  - {competencia: 2025-07, valor: '30.000,00', medicao: 4}
  - {competencia: 2025-08, valor: '25.000,00', medicao: 5}
  # --- Apostilamento de reajuste, estilo MT-PAR: `percentual` sobre o `periodo`, sem lista de competências; `valor`
  # é o total apostilado, só informativo.
- chave: ap-reaj-02
  tipo: apostilamento_reajuste
  data: '2026-04-20'
  numero: 001/2025/03/02
  objeto: 2º Termo de Apostilamento de reajuste (data-base 01/2025)
  data_base: 2025-01
  ciclo: 2026
  periodo: {de: 2026-01, ate: 2026-03}
  percentual: '3,50'
  valor: 52.500,00
  # --- Retificação: termo novo com `corrige` apontando o anterior, que deixa de valer (o anterior não se altera).
- chave: ap-reaj-02-ret
  tipo: apostilamento_reajuste
  data: '2026-05-11'
  numero: 001/2025/03/03
  objeto: 3º Termo de Apostilamento (retifica o 2º, percentual de 3,80%)
  corrige: ap-reaj-02
  data_base: 2025-01
  ciclo: 2026
  periodo: {de: 2026-01, ate: 2026-03}
  percentual: '3,80'
  valor: 57.000,00
  # --- Aditivo de valor com natureza de reajuste (o valor não entra como execução).
- chave: ta-02
  tipo: aditivo_valor
  data: '2026-05-18'
  numero: 001/2025/01/02
  objeto: 2º Termo Aditivo de valor (reajuste, R$ 100.000,00)
  delta_valor: 100.000,00
  natureza: reajuste
  # --- Paralisação e reinício: a obra fica paralisada entre as datas; o reinício fecha a paralisação.
- chave: par-01
  tipo: paralisacao
  data: '2025-08-04'
  numero: OS-PAR-001
  objeto: Ordem de paralisação das obras (chuvas)
- chave: rei-01
  tipo: reinicio
  data: '2025-09-01'
  numero: OS-REI-001
  objeto: Ordem de reinício das obras
  # --- Endosso de garantia: `apolice` (a do contrato), nova `vigencia_fim` e `referente` (instrumento de prazo que
  # motivou o endosso).
- chave: end-01
  tipo: endosso_garantia
  data: '2026-06-10'
  numero: END-EXEMPLO-001
